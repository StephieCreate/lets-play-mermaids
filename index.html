    <script>
      // Phone-only portrait lock: silently attempt orientation lock on small, touch
      // screens only — never tablets or desktops. No rotate warning, no CSS hacks.
      (function () {
        function isPhone() {
          return (
            Math.min(window.screen.width, window.screen.height) < 600 &&
            window.matchMedia('(pointer: coarse)').matches
          );
        }
        function tryLock() {
          if (!isPhone()) return;
          try {
            var result = screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait');
            if (result && typeof result.catch === 'function') result.catch(function () {});
          } catch (e) {
            /* unsupported — ignore silently */
          }
        }
        tryLock();
        window.addEventListener('orientationchange', tryLock);
        if (screen.orientation && typeof screen.orientation.addEventListener === 'function') {
          screen.orientation.addEventListener('change', tryLock);
        }
      })();
    </script>
